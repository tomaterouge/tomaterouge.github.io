name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      # ⚠️ Critical: Generate routes before building
      - name: Generate Routes
        run: npx tsr generate

      - name: Build
        run: npm run build

      # ⚠️ Critical: Fix routing for SPA on GitHub Pages
      # This ensures refreshing a sub-route redirects to the app entry point
      - name: Copy index.html to 404.html
        run: cp dist/index.html dist/404.html

      # ⚠️ Critical: Add .nojekyll to bypass Jekyll processing
      # This ensures files starting with _ (like _assets) are served
      - name: Add .nojekyll
        run: touch dist/.nojekyll

      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages